spring:
  application:
    name: campus-trade

  # 本地敏感配置覆盖（application-local.yaml 已被 .gitignore 排除）
  config:
    import: optional:file:./application-local.yaml


  # ===== 数据库连接 =====
  datasource:
    url: jdbc:mysql://localhost:3306/campus_trade?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    # 密码从环境变量读取，绝不写进代码
    # IDEA 设置：Run → Edit Configurations → Environment variables
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

# ===== MyBatis-Plus =====
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true                      # is_deleted → isDeleted 自动映射
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # ★ 控制台打印真实 SQL
  global-config:
    db-config:
      logic-delete-field: isDeleted     # 逻辑删除字段（数据库设计里有）
      logic-delete-value: 1             # 删除后置 1
      logic-not-delete-value: 0         # 未删除为 0
  mapper-locations: classpath*:mapper/**/*.xml

# ===== JWT =====
jwt:
  # 签名密钥：HS256 要求至少 32 字节（256 位），太短 jjwt 会直接报错
  # 生产环境要放环境变量 / 配置中心，绝不能提交到 Git
  secret: ${JWT_SECRET}
  expiration: 604800000   # 7 天（单位：毫秒）

# ===== 端口 =====
server:
  port: 8080